<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f2fb">
<title>Колесо возможностей - Лаванда</title>
<link rel="stylesheet" href="style.css?v=8">
<script src="https://telegram.org/js/telegram-web-app.js" async></script>
</head>
<body class="v-lav">
<div class="bg" aria-hidden="true"></div>
<main class="app">
  <header class="head"><h1 id="t-title2"></h1><div class="result-name" id="resultName" aria-live="polite"></div></header>
  <section class="stage">
    <div class="wheel-box" id="wheelMain">
      <div class="pointer" id="pointer" aria-hidden="true"><svg viewBox="0 0 40 52"><path d="M20 50 6 15a15 15 0 1 1 28 0z" fill="#4b3f72" stroke="#f5f2fb" stroke-width="2.5" stroke-linejoin="round"/><circle cx="20" cy="14" r="4.5" fill="#e8c4b0"/></svg></div>
    </div>
  </section>
  <div class="actions">
    <button class="btn btn-main" id="spinBtn" type="button"></button>
    <p class="note" id="counter"></p>
    <p class="note" id="demoNote"></p>
  </div>
</main>
<section class="splash" id="splash">
  <div class="wheel-box" id="wheelSplash"></div>
  <p class="kicker" id="t-kicker"></p>
  <h1 id="t-title"></h1>
  <p class="sub" id="t-sub"></p>
  <button class="btn btn-main" id="startBtn" type="button"></button>
</section>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="cardTitle">
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="card" aria-live="polite">
    <div class="card-ic" id="cardIcon"></div>
    <h2 id="cardTitle"></h2>
    <p id="cardText"></p>
    <div class="card-btns">
      <button class="btn btn-primary" id="actionBtn" type="button"></button>
      <div class="card-row">
        <button class="btn btn-sec" id="againBtn" type="button"></button>
        <button class="btn btn-sec" id="shareBtn" type="button"></button>
        <button class="btn btn-sec" id="contactBtn" type="button"></button>
      </div>
    </div>
  </div>
</div>
<div class="sheet" id="panel" hidden role="dialog" aria-modal="true" aria-labelledby="panelTitle">
  <div class="sheet-bg" id="panelBg"></div>
  <div class="card panel" id="panelScroll">
    <h2 id="panelTitle"></h2>
    <p class="p-intro" id="panelIntro"></p>
    <div id="panelBody"></div>
    <div class="card-btns">
      <button class="btn btn-primary" id="panelLink" type="button" hidden></button>
      <div class="card-row">
        <button class="btn btn-sec" id="panelAgain" type="button">Крутить ещё</button>
        <button class="btn btn-sec" id="panelBack" type="button">Назад</button>
      </div>
    </div>
  </div>
</div>
<div class="flash" id="flash" aria-hidden="true"></div>
<canvas class="fx" id="fx" aria-hidden="true"></canvas>
<script src="config.js?v=8"></script>
<script src="icons.js?v=8"></script>
<script src="app.js?v=8"></script>
</body>
</html>
