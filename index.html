<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff3df">
<title>Колесо возможностей - Яркий поп</title>
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js" async></script>
</head>
<body class="v-pop">
<div class="bg" aria-hidden="true"></div>
<main class="app">
  <header class="head"><h1 id="t-title2"></h1></header>
  <section class="stage">
    <div class="wheel-box" id="wheelMain">
      <div class="pointer" id="pointer" aria-hidden="true"><svg viewBox="0 0 40 52"><path d="M20 50 5 14a16 16 0 1 1 30 0z" fill="#ff6b5a" stroke="#2b2233" stroke-width="4" stroke-linejoin="round"/><circle cx="20" cy="14" r="5" fill="#fff3df" stroke="#2b2233" stroke-width="3"/></svg></div>
    </div>
  </section>
  <div class="actions">
    <button class="btn btn-main" id="spinBtn" type="button"></button>
    <p class="note" id="demoNote"></p>
  </div>
</main>
<section class="splash" id="splash">
  <div class="wheel-box" id="wheelSplash"></div>
  <p class="kicker" id="t-kicker"></p>
  <h1 id="t-title"></h1>
  <p class="sub" id="t-sub"></p>
  <button class="btn btn-main" id="startBtn" type="button"></button>
</section>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="cardTitle">
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="card" aria-live="polite">
    <div class="card-ic" id="cardIcon"></div>
    <h2 id="cardTitle"></h2>
    <p id="cardText"></p>
    <div class="card-btns">
      <button class="btn btn-primary" id="againBtn" type="button"></button>
      <div class="card-row">
        <button class="btn btn-sec" id="shareBtn" type="button"></button>
        <button class="btn btn-sec" id="contactBtn" type="button"></button>
      </div>
    </div>
  </div>
</div>
<div class="flash" id="flash" aria-hidden="true"></div>
<canvas class="fx" id="fx" aria-hidden="true"></canvas>
<script src="config.js"></script>
<script src="icons.js"></script>
<script src="app.js"></script>
</body>
</html>
